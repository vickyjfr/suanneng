# SE9 dedicated HTTPS/WSS endpoint on port 8443.
#
# Uses the short-lived Let's Encrypt IP certificate so standard CA + IP-SAN
# hostname verification works for the SE9 App and NAS Agent. Port 443 keeps
# the stable *.hualaikeji.com certificate required by the PSYNC pinned-IP
# client, so the two deployments must not share the 443 certificate.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 123.56.147.51;

    ssl_certificate /etc/se9-certbot/live/123.56.147.51/fullchain.pem;
    ssl_certificate_key /etc/se9-certbot/live/123.56.147.51/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 128m;

    location ^~ /se9/ {
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
    }

    location / { return 404; }
}
