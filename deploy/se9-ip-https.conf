# IP:443 default virtual host.
#
# Certificate policy: this vhost is the default_server for 123.56.147.51:443,
# so it must serve the same stable *.hualaikeji.com certificate that clients
# pinned before the SE9 IP deployment. Do NOT point it back at the short-lived
# Let's Encrypt IP certificate: that certificate rotates every few days and
# breaks the Flutter pinned-IP transport (OWN_API_STOREKIT_CERT_SHA256).
# The IP certificate in /etc/se9-certbot is still renewed for TURN TLS (5349).
#
# The /v1/ and /healthz routes belong to the PSYNC API that shares this ECS and
# the default 443 vhost; keep them here so re-installing this file does not
# break the App's HTTPS IP transport.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 123.56.147.51;

    ssl_certificate /etc/nginx/ssl/hualaikeji.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hualaikeji.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 10m;

    location /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    location = /v1/my/workspace/modify {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    location ^~ /se9/ {
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        client_max_body_size 128m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
